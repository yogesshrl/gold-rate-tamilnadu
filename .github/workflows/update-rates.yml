name: Update gold rates

on:
  schedule:
    # India time (cron is UTC). The Madras jewellers' association publishes at 9:30 AM
    # and 3:30 PM, and shops copy it within minutes. GitHub often starts runs 5-30
    # minutes late, so each publication gets a first read and a later catch-up.
    - cron: '35 4 * * *' # 10:05 AM
    - cron: '0 6 * * *' # 11:30 AM catch-up
    - cron: '30 10 * * *' # 4:00 PM
    - cron: '30 11 * * *' # 5:00 PM catch-up
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run tests for the readers
        run: node --test "src/lib/*.test.ts" "scripts/*.test.ts"

      - name: Fetch today's rates
        env:
          # The 5 PM catch-up fails loudly if no rate was saved all day.
          REQUIRE_TODAY: ${{ github.event.schedule == '30 11 * * *' && '1' || '' }}
        run: node scripts/update-rates.ts

      - name: Save the rates file
        run: |
          if git diff --quiet -- data/rates.json; then
            echo "No change in rates."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rates.json
          git commit -m "Update rates"
          git push
